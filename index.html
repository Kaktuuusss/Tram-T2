<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101419"><title>Tram T2 Simulator</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}button{font:inherit;color:#fff;border:1px solid #707880;border-radius:14px;background:#39434d;min-height:54px;padding:10px 14px;font-weight:700;user-select:none}button:active{transform:scale(.96);background:#4a5661}#scene{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#73afd8 0 48%,#555b60 48% 100%)}.skyline{position:absolute;left:0;right:0;top:26%;height:27%;background:repeating-linear-gradient(90deg,#555 0 45px,#777 45px 82px,#4d4d4d 82px 125px)}.road{position:absolute;left:0;right:0;bottom:0;height:43%;background:#303337}.track{position:absolute;left:39%;right:39%;top:0;bottom:0;border-left:3px solid #aaa;border-right:3px solid #aaa}.track:after{content:"";position:absolute;left:0;right:0;top:50%;height:6px;background:repeating-linear-gradient(90deg,transparent 0 25px,#888 25px 32px)}.car{position:absolute;width:50px;height:24px;border-radius:7px;background:#eee;bottom:16%;animation:drive 8s linear infinite}.car2{background:#d45;bottom:25%;animation-duration:11s}@keyframes drive{from{left:-60px}to{left:105%}}#hud{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:5px}.badge{background:#000b;border:1px solid #777;border-radius:10px;padding:7px 9px;font-size:12px}#cab{position:absolute;z-index:4;left:0;right:0;bottom:0;height:40%;min-height:225px;background:linear-gradient(#24292e,#090b0d);border-top:3px solid #666;padding:8px}#dash{height:100%;border:2px solid #555;border-radius:15px;background:#252a30;padding:10px;position:relative}#gauge{width:74px;height:74px;border:5px solid #aaa;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:18px}#info{position:absolute;left:98px;top:10px;font-size:13px;line-height:1.55}#topButtons{position:absolute;right:8px;top:8px;display:flex;gap:6px}#controls{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}#controls button{flex:1}.start{position:absolute;z-index:20;inset:0;background:linear-gradient(#17242e,#07090b);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.card{max-width:420px}.card h1{font-size:30px;margin:0 0 10px}.card p{color:#ccc;line-height:1.5}.startBtn{background:#1677ff;font-size:18px;padding:16px 28px;min-height:62px}#msg{position:absolute;z-index:10;top:22%;left:50%;transform:translateX(-50%);background:#000d;border-radius:12px;padding:12px 18px;display:none;white-space:nowrap}#doors{position:absolute;z-index:9;left:50%;bottom:41%;transform:translateX(-50%);display:none;background:#ffd43b;color:#111;padding:6px 12px;border-radius:10px;font-weight:800}@media(max-width:600px){#cab{height:43%;min-height:235px}.badge{font-size:11px;padding:6px}.card h1{font-size:27px}#info{font-size:12px}.topBtn{min-height:48px;padding:8px}}</style></head><body><div id="scene"><div class="skyline"></div><div class="road"></div><div class="track"></div><div class="car"></div><div class="car car2"></div><div id="hud"><div class="badge">🚋 T2</div><div class="badge">💶 <span id="score">0</span></div><div class="badge">🚏 <span id="stop">1</span>/8</div></div><div id="cab"><div id="dash"><div id="gauge">⚡<span id="speed">0</span></div><div id="info"><b>TRAM T2</b><br>Скорость: <span id="speed2">0</span> км/ч<br>Остановка: <span id="next">Viru</span><br>Сигнал: <span id="signal">🟢</span></div><div id="topButtons"><button id="doorBtn">🚪 ДВЕРИ</button><button id="hornBtn">📣</button></div><div id="controls"><button id="brakeBtn">◀ ТОРМОЗ</button><button id="powerBtn">ТЯГА ▶</button><button id="stopBtn">⏸ СТОП</button></div></div></div><div id="doors">🚪 ДВЕРИ ОТКРЫТЫ</div><div id="msg"></div><div id="start" class="start"><div class="card"><h1>🚋 Tram Simulator T2</h1><p>Мобильная версия для GitHub Pages.<br>Все кнопки работают с касанием на iPhone.</p><button class="startBtn" id="startBtn">НАЧАТЬ РЕЙС</button></div></div></div><script>(()=>{let running=false,speed=0,score=0,stop=1,doors=false;const stops=['Viru','Hobujaama','Kadriorg','Ülemiste','Tondi','Vabaduse väljak','Balti jaam','Kopli'];const $=id=>document.getElementById(id);function update(){speed=Math.max(0,Math.min(70,speed));$('speed').textContent=Math.round(speed);$('speed2').textContent=Math.round(speed);$('score').textContent=score;$('stop').textContent=stop;$('next').textContent=stops[stop-1]||'Конечная'}function message(t){$('msg').textContent=t;$('msg').style.display='block';clearTimeout(window.mt);window.mt=setTimeout(()=>$('msg').style.display='none',1800)}function bind(id,fn){$(id).addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();fn()},{passive:false})}bind('startBtn',()=>{$('start').style.display='none';running=true;message('🚋 Рейс T2 начат!');update()});bind('powerBtn',()=>{if(!running||doors)return;speed+=4;update()});bind('brakeBtn',()=>{if(!running)return;speed-=8;update()});bind('stopBtn',()=>{if(!running)return;speed=0;update();message('🛑 Трамвай остановлен')});bind('doorBtn',()=>{if(!running)return;if(speed>2){message('⚠️ Сначала остановись');return}doors=!doors;$('doors').style.display=doors?'block':'none';if(doors){score+=10;message('🚪 Двери открыты');setTimeout(()=>{if(doors){doors=false;$('doors').style.display='none';if(stop<8){stop++;score+=15;message('🚏 Следующая: '+stops[stop-1])}else{score+=100;running=false;message('🏁 Рейс завершён!')}}update()},1800)}else message('🚪 Двери закрыты');update()});bind('hornBtn',()=>{if(running)message('📣 ДИИНЬ-ДИИНЬ!')});setInterval(()=>{if(running&&speed>0){score++;update()}},4000);setInterval(()=>{if(running&&Math.random()<.18){$('signal').textContent='🔴';setTimeout(()=>$('signal').textContent='🟢',2200)}},5000);update()})();</script></body></html>
