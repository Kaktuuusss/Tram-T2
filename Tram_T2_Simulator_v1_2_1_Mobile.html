<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tram T2 Simulator v1.2.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff;touch-action:manipulation}
#scene{height:100%;background:linear-gradient(#73afd8 0 48%,#555b60 48%);position:relative}
.buildings{position:absolute;left:0;right:0;top:27%;height:25%;background:repeating-linear-gradient(90deg,#555 0 45px,#777 45px 82px,#4d4d4d 82px 125px)}
.road{position:absolute;left:0;right:0;bottom:0;height:42%;background:#303337}
.track{position:absolute;top:0;bottom:0;left:39%;right:39%;border-left:3px solid #aaa;border-right:3px solid #aaa}
.car{position:absolute;width:48px;height:23px;border-radius:6px;background:#eee;bottom:16%;animation:drive 8s linear infinite}
.car2{background:#d45;bottom:25%;animation-duration:11s}
@keyframes drive{from{left:-60px}to{left:105%}}
#hud{position:absolute;z-index:3;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px}
.badge{background:#000b;border:1px solid #777;border-radius:9px;padding:7px;font-size:12px}
#cab{position:absolute;z-index:2;left:0;right:0;bottom:0;height:39%;background:linear-gradient(#24292e,#090b0d);border-top:3px solid #666;padding:9px}
#dash{height:100%;border:2px solid #555;border-radius:15px;background:#252a30;padding:10px;position:relative}
#gauge{width:72px;height:72px;border:5px solid #aaa;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:18px}
#info{position:absolute;left:100px;top:12px;font-size:13px;line-height:1.55}
#buttons{position:absolute;right:8px;top:8px;display:flex;gap:6px}
button{border:1px solid #777;border-radius:11px;background:#3d454e;color:#fff;padding:12px;font-size:13px;font-weight:bold}
button:active{transform:scale(.96)}
#controls{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}
#controls button{flex:1}
#start{position:absolute;z-index:20;inset:0;background:linear-gradient(#17242e,#07090b);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{max-width:420px}.card h1{font-size:30px;margin:0 0 10px}.card p{color:#ccc;line-height:1.5}.startBtn{background:#1677ff;font-size:18px;padding:16px 28px}
#msg{position:absolute;z-index:10;top:22%;left:50%;transform:translateX(-50%);background:#000d;border-radius:12px;padding:12px 18px;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="scene">
<div class="buildings"></div><div class="road"></div><div class="track"></div>
<div class="car"></div><div class="car car2"></div>
<div id="hud"><div class="badge">🚋 T2</div><div class="badge">💶 <span id="score">0</span></div><div class="badge">🚏 <span id="stop">1</span>/8</div></div>

<div id="cab">
<div id="dash">
<div id="gauge">⚡<span id="speed">0</span></div>
<div id="info"><b>TRAM T2</b><br>Скорость: <span id="speed2">0</span> км/ч<br>Остановка: <span id="next">Viru</span><br>Сигнал: <span id="signal">🟢</span></div>
<div id="buttons"><button id="doorBtn">🚪 ДВЕРИ</button><button id="hornBtn">📣</button></div>
<div id="controls"><button id="brakeBtn">◀ ТОРМОЗ</button><button id="powerBtn">ТЯГА ▶</button><button id="stopBtn">⏸ СТОП</button></div>
</div>
</div>

<div id="msg"></div>
<div id="start"><div class="card">
<h1>🚋 Tram Simulator T2</h1>
<p>v1.2.1 Mobile<br>Нажми кнопку ниже, чтобы начать рейс.</p>
<button class="startBtn" id="startBtn">НАЧАТЬ РЕЙС</button>
</div></div>
</div>

<script>
(function(){
let running=false,speed=0,score=0,stop=1,doors=false;
const stops=["Viru","Hobujaama","Kadriorg","Ülemiste","Tondi","Vabaduse väljak","Balti jaam","Kopli"];
const $=id=>document.getElementById(id);
function update(){
 speed=Math.max(0,Math.min(70,speed));
 $("speed").textContent=Math.round(speed);$("speed2").textContent=Math.round(speed);
 $("score").textContent=score;$("stop").textContent=stop;$("next").textContent=stops[stop-1]||"Конечная";
}
function message(t){
 $("msg").textContent=t;$("msg").style.display="block";
 clearTimeout(window.timer);window.timer=setTimeout(()=>{$("msg").style.display="none"},1800);
}
$("startBtn").addEventListener("click",function(){
 $("start").style.display="none";running=true;message("🚋 Рейс T2 начат!");update();
});
$("powerBtn").addEventListener("click",function(){if(!running)return;speed+=4;if(speed>55)message("⚠️ Слишком высокая скорость");update()});
$("brakeBtn").addEventListener("click",function(){if(!running)return;speed-=8;update()});
$("stopBtn").addEventListener("click",function(){if(!running)return;speed=0;update();message("🛑 Трамвай остановлен")});
$("doorBtn").addEventListener("click",function(){
 if(!running)return;
 if(speed>2){message("⚠️ Сначала остановись");return}
 doors=!doors;
 if(doors){
  score+=10;message("🚪 Двери открыты");
  setTimeout(function(){if(doors){doors=false;nextStop()}},1800);
 }else message("🚪 Двери закрыты");
 update();
});
$("hornBtn").addEventListener("click",function(){if(running)message("📣 ДИИНЬ-ДИИНЬ!")});
function nextStop(){
 if(stop<8){stop++;score+=15;message("🚏 Следующая: "+stops[stop-1])}
 else{score+=100;running=false;message("🏁 Рейс завершён! "+score+" очков")}
 update();
}
setInterval(function(){if(running&&speed>0){score++;update()}},4000);
setInterval(function(){if(running&&Math.random()<.18){$("signal").textContent="🔴";setTimeout(()=>$("signal").textContent="🟢",2200)}},5000);
update();
})();
</script>
</body>
</html>
